AWSTemplateFormatVersion: "2010-09-09"
Description: LookFind regional API, Lambda and PostgreSQL
Parameters:
  ImageUri: {Type: String}
  SubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  VpcId: {Type: AWS::EC2::VPC::Id}
  ProductBucketName: {Type: String, Default: software2026, Description: AWS_BUCKET_NAME from backend/.env.production (IAM read scope)}
  # App settings live in backend/.env.production; scripts/deploy.sh stores it in this secret.
  AppEnvSecretArn: {Type: String, Description: Secrets Manager ARN holding backend/.env.production}
  AppEnvVersion: {Type: String, Default: "0", Description: Hash of .env.production; a new value restarts Lambda so it reloads the file}
Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties: {GroupDescription: LookFind Lambda, VpcId: !Ref VpcId}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LookFind PostgreSQL
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref LambdaSecurityGroup}
  SecretEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LookFind Secrets Manager endpoint
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LambdaSecurityGroup}
  SecretEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds: [!Select [0, !Ref SubnetIds]]
      SecurityGroupIds: [!Ref SecretEndpointSecurityGroup]
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties: {DBSubnetGroupDescription: LookFind database subnets, SubnetIds: !Ref SubnetIds}
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: fashion
      MasterUsername: fashion
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: LookFindRuntime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - {Effect: Allow, Action: [secretsmanager:GetSecretValue], Resource: [!GetAtt Database.MasterUserSecret.SecretArn, !Ref AppEnvSecretArn]}
              - {Effect: Allow, Action: [s3:GetObject], Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProductBucketName}/*'}
  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: Database
    Properties:
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Architectures: [x86_64]
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 3008
      # Container imports can exceed Lambda's 10-second init phase. Allow the
      # suppressed init to finish instead of killing the execution environment;
      # API Gateway still enforces its own 30-second request limit.
      Timeout: 120
      EphemeralStorage: {Size: 4096}
      VpcConfig: {SubnetIds: !Ref SubnetIds, SecurityGroupIds: [!Ref LambdaSecurityGroup]}
      # Everything else comes from backend/.env.production (loaded at cold start, see config.load_app_env).
      # Only values that exist after deployment are set here.
      Environment:
        Variables:
          APP_ENV_SECRET_ARN: !Ref AppEnvSecretArn
          APP_ENV_VERSION: !Ref AppEnvVersion
          DATABASE_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          DATABASE_HOST: !GetAtt Database.Endpoint.Address
          DATABASE_PORT: !GetAtt Database.Endpoint.Port
  # One-off catalog loader (scripts/deploy.sh seed): same image, seed bundled in it, 15-minute timeout
  # instead of the API's 29 s. Runs src/jobs/load_seed.py; safe to re-run.
  SeedFunction:
    Type: AWS::Lambda::Function
    DependsOn: Database
    Properties:
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      ImageConfig: {Command: [src.jobs.load_seed.handler]}
      Architectures: [x86_64]
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 1024
      Timeout: 900
      VpcConfig: {SubnetIds: !Ref SubnetIds, SecurityGroupIds: [!Ref LambdaSecurityGroup]}
      Environment:
        Variables:
          APP_ENV_SECRET_ARN: !Ref AppEnvSecretArn
          DATABASE_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          DATABASE_HOST: !GetAtt Database.Endpoint.Address
          DATABASE_PORT: !GetAtt Database.Endpoint.Port
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties: {Name: lookfind-api, ProtocolType: HTTP}
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: "$default", Target: !Sub 'integrations/${Integration}'}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties: {ApiId: !Ref HttpApi, StageName: "$default", AutoDeploy: true}
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${ApiFunction}', RetentionInDays: 14}
Outputs:
  SeedFunctionName: {Value: !Ref SeedFunction}
  ApiOriginDomain: {Value: !Sub '${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'}
  ApiUrl: {Value: !GetAtt HttpApi.ApiEndpoint}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  DatabaseSecretArn: {Value: !GetAtt Database.MasterUserSecret.SecretArn}
